[project]
name = "hackathon-synth-data-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ia10307", email = "irene.aji@uk-augsburg.de" }
]
requires-python = ">=3.12"

dependencies = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "paramiko<4",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.12.1",
    "sdv",
    "seaborn>=0.13.2",
    "shap==0.47.0",
    "sqlalchemy>=2.0.49",
    "sshtunnel>=0.4.0",
    "xgboost>=2.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[project.scripts]
hackathon-synth-data-2026 = "hackathon_synth_data_2026:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

